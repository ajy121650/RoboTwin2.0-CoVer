# CoVer-faithful training: every departure of this port switched back to what
# bridge_verifier/ensemble_eval/finetune_trajectory_bridge_ddp.py did. Use this
# as the "CoVer re-trained in domain" baseline; default.yaml is the modified one.
#
#   negatives     each GPU's own batch only (63)
#   action enc.   transformer without position embedding
#   token_scale   none  (tokens enter the heads L2-normalised)
#   text_mask     false (pad tokens take part in pooling)
#   weight decay  applied to every parameter
#   lr            1e-6 as in CoVer. CoVer saw ~20M samples x 50 epochs; this set is
#                 ~0.76M pairs/epoch, so expect to need many more epochs at this lr
#                 or raise it (--set train.lr=1e-5) as a documented deviation.
data: null
out: null
hf_home: null
image_cache: auto           # auto = use <data>/images_<S>.u8.npy if present (see cache_images.py); none = decode JPEGs online

model:
  backbone: hf-hub:timm/ViT-L-16-SigLIP2-384
  text_pool_dim: 512
  vision_pool_dim: 512
  pool_heads: 8
  pool_layers: 4
  num_readouts: 1
  action_dim: 14
  window: 50
  action_encoder: transformer
  action_layers: 4
  action_pos_emb: false
  action_dropout: 0.1
  pad_value: -5.0
  backbone_chunk: 256       # frozen towers are run in slices of this many samples
  text_mask: false
  token_scale: none

warm_start: null

train:
  batch_size: 64
  gather_negatives: false
  epochs: 15
  lr: 1.0e-6
  weight_decay: 0.05
  decay_all: true
  warmup_steps: 2000
  grad_clip: 1.0
  per_task_cap: 40000
  num_workers: 8
  prefetch_factor: 4        # batches each worker keeps ready; lower it for very large batches (RAM)
  seed: 0
  val_every: 500
  val_pairs: 4096
  val_batch_size: 256
  log_every: 50
  max_steps: null
  wandb: false
  wandb_project: robotwin-verifier
