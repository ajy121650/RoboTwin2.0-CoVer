# Verifier training config. Paths are given on the command line (--data, --out)
# so the same file works on any machine; export HF_HOME to place the SigLIP2
# download (~3.3 GB) on a disk with room.
data: null
out: null
hf_home: null

model:
  backbone: hf-hub:timm/ViT-L-16-SigLIP2-384
  text_pool_dim: 512
  vision_pool_dim: 512
  pool_heads: 8
  pool_layers: 4
  num_readouts: 1
  action_dim: 14
  window: 50
  action_encoder: transformer
  action_layers: 4
  action_pos_emb: true      # false = CoVer (no position information in the window)
  action_dropout: 0.1
  pad_value: -5.0
  text_mask: true
  token_scale: sqrt_dim     # "none" = CoVer scaling (use with warm_start)

warm_start: null            # path to cover_verifier_bridge.pt to init text/vision heads

train:
  batch_size: 64            # per GPU
  gather_negatives: false   # false = each GPU scores its own batch (63 negatives, as CoVer);
                            # true = all-gather embeddings, negatives = 64 x GPUs - 1
  epochs: 15
  lr: 1.0e-5
  weight_decay: 0.05
  decay_all: false          # true = CoVer (decay biases/norms/scalars too)
  warmup_steps: 2000
  grad_clip: 1.0
  per_task_cap: 40000       # pairs per task per epoch (median task ~12k pairs; caps the 4 biggest)
  num_workers: 8
  seed: 0
  val_every: 500
  val_pairs: 4096           # holdout pairs used for the running validation
  val_batch_size: 256
  log_every: 50
  max_steps: null           # for smoke tests
  wandb: false
  wandb_project: robotwin-verifier
